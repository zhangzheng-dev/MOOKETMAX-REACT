server:
  port: 8080
  tomcat:
    uri-encoding: UTF-8

spring:
  application:
    name: social
  # 不配置任何 datasource，让它们通过 Java Config 手动创建
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force-request: true
      force-response: true
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  # 启用调度
  task:
    scheduling:
      enabled: true
  # Redis 配置
  data:
    redis:
      host: 43.139.56.124
      port: 6379
      database: 0
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 生产环境关闭 SQL 日志输出（避免 54GB 日志）。需要排查 SQL 时临时改回 StdOutImpl
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    root: INFO
    com.mooket.social: INFO
    com.mooket.social.mapper: WARN
    com.mooket.social.mysql.mapper: WARN
    com.mooket.social.erp.mapper: WARN
    com.mooket.social.uac.mapper: WARN
    org.springframework.jdbc: WARN
    org.mybatis: WARN

mooket:
  internal:
    sql:
      enabled: ${MOOKET_INTERNAL_SQL_ENABLED:false}
      allow-writes: ${MOOKET_INTERNAL_SQL_ALLOW_WRITES:false}
  datasource:
    primary:
      jdbc-url: ${MOOKET_PRIMARY_JDBC_URL}
      username: ${MOOKET_PRIMARY_DB_USERNAME}
      password: ${MOOKET_PRIMARY_DB_PASSWORD}
    mysql:
      jdbc-url: ${MOOKET_MYSQL_JDBC_URL}
      username: ${MOOKET_MYSQL_DB_USERNAME}
      password: ${MOOKET_MYSQL_DB_PASSWORD}
    erp:
      jdbc-url: ${MOOKET_ERP_JDBC_URL}
      username: ${MOOKET_ERP_DB_USERNAME}
      password: ${MOOKET_ERP_DB_PASSWORD}
    uac:
      jdbc-url: ${MOOKET_UAC_JDBC_URL}
      username: ${MOOKET_UAC_DB_USERNAME}
      password: ${MOOKET_UAC_DB_PASSWORD}
