# MySQL 数据源配置 (增量同步专用)
mysql:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://{host}:{port}/{database}?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: {username}
    password: {password}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 30000
